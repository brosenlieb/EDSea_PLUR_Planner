services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-trixie
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}        
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: festival_backend
    volumes:
      - ./backend:/app  # Bind mount for local backend dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # Enable hot-reload
    environment:
      # Dynamically inject the database URL using your existing .env variables
      DB_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      EASTERN_TZ: America/New_York
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev # Use the dev Dockerfile
    container_name: festival_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1 # Used by browser
      INTERNAL_API_URL: http://backend:8000/api/v1 # Used by Next.js server
      WATCHPACK_POLLING: "true" # Ensures hot-reload works reliably inside Docker
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app             # Sync local code changes to the container
      - /app/node_modules           # Prevent local node_modules from overwriting the container's
      - /app/.next                  # Keep Next.js build cache inside the container
    depends_on:
      - backend

volumes:
  postgres_data: